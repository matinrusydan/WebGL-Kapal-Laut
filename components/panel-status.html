<div class="panel" id="panel-status">
  <div class="panel-title">STATUS KAPAL</div>
  <div class="stat-row">
    <div><div class="stat-label">ANGIN</div><div class="stat-bar"><div class="stat-bar-fill" id="bar-wind" style="width:50%"></div></div></div>
    <div class="stat-val" id="val-wind">SEDANG</div>
  </div>
  <div class="stat-row">
    <div><div class="stat-label">OMBAK</div><div class="stat-bar"><div class="stat-bar-fill" id="bar-wave" style="width:65%"></div></div></div>
    <div class="stat-val" id="val-wave">BESAR</div>
  </div>
  <div class="stat-row">
    <div><div class="stat-label">KEMIRINGAN</div><div class="stat-bar stat-danger"><div class="stat-bar-fill" id="bar-tilt" style="width:35%"></div></div></div>
    <div class="stat-val danger" id="val-tilt">7.0 deg</div>
  </div>
  <div class="stat-row">
    <div><div class="stat-label">KECEPATAN</div><div class="stat-bar stat-ok"><div class="stat-bar-fill" id="bar-speed" style="width:40%"></div></div></div>
    <div class="stat-val good" id="val-speed">12 KN</div>
  </div>
  <div class="stat-row">
    <div><div class="stat-label">PITCH</div><div class="stat-bar"><div class="stat-bar-fill" id="bar-pitch" style="width:20%"></div></div></div>
    <div class="stat-val" id="val-pitch">2.1 deg</div>
  </div>
  <div class="stat-row">
    <div><div class="stat-label">AMPLITUDO</div><div class="stat-bar"><div class="stat-bar-fill" id="bar-amp" style="width:30%"></div></div></div>
    <div class="stat-val" id="val-amp">0.00</div>
  </div>
  <div class="stat-row">
    <div><div class="stat-label">VISIBILITAS</div><div class="stat-bar"><div class="stat-bar-fill" id="bar-vis" style="width:80%"></div></div></div>
    <div class="stat-val" id="val-vis">8 NM</div>
  </div>
</div>
